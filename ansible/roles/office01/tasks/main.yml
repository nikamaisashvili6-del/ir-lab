---
# office01 is the weak desktop: one user with a guessable password and SSH open to it.
- name: Install fail2ban, left off because turning it on is the trainee fix
  ansible.builtin.apt:
    name: [fail2ban, openssh-server]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep fail2ban stopped and disabled
  ansible.builtin.service:
    name: fail2ban
    state: stopped
    enabled: false

- name: Create the weak user jdoe
  ansible.builtin.user:
    name: jdoe
    shell: /bin/bash
    # Deliberately weak and public: this password is part of the exercise.
    password: "{{ 'Summer2026!' | password_hash('sha512', 'irlabjdoe') }}"

- name: Allow password logins for jdoe only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-irlab-jdoe.conf
    mode: "0644"
    content: |
      Match User jdoe
          PasswordAuthentication yes
  notify: Restart ssh
