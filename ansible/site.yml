---
- name: Prepare the host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: host
      tags: [host]

- name: Build the firewall
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: pfsense
      tags: [pfsense]

- name: Create the Debian VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: base
      tags: [vms]

- name: Configure web01
  hosts: web01
  become: true
  roles:
    - role: web01
      tags: [web01]

- name: Configure office01
  hosts: office01
  become: true
  roles:
    - role: office01
      tags: [office01]

- name: Install Wazuh
  hosts: wazuh
  become: true
  roles:
    - role: wazuh
      tags: [wazuh]

- name: Install Wazuh agents
  hosts: web01:office01
  become: true
  roles:
    - role: wazuh_agent
      tags: [agents]
