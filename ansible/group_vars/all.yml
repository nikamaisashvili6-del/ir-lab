---
lab_state_dir: "{{ playbook_dir }}/../.lab"
virsh_uri: qemu:///system
irlab_networks:
  - irlab-wan
  - irlab-lan
  - irlab-mgmt
debian_image_dir: https://cloud.debian.org/images/cloud/trixie/latest
debian_image_name: debian-13-genericcloud-amd64.qcow2
# The three Debian VMs. last_octet is the same on LAN (10.20.0.x) and mgmt (10.21.0.x).
lab_vms:
  - {name: web01, last_octet: 10, memory: 768, disk: 6G, image: "{{ debian_image_name }}"}
  - {name: office01, last_octet: 20, memory: 512, disk: 6G, image: "{{ debian_image_name }}"}
  - {name: wazuh, last_octet: 30, memory: 4096, disk: 20G, image: "{{ wazuh_image_name }}"}
# Switched to the Debian 12 image in Task 5 if the pinned Wazuh release doesn't support 13.
wazuh_image_name: "{{ debian_image_name }}"
