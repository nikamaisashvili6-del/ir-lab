---
name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned tools
        run: pip install -r requirements.txt
      - name: YAML lint
        run: yamllint .
      - name: Ansible lint
        run: ansible-lint ansible/
      - name: Playbook syntax
        run: ansible-playbook -i ansible/inventory.yml ansible/site.yml --syntax-check -e lab_root=/tmp/ir-lab
      - name: Unit tests
        run: pytest -q tests
